name: Build Hailo YOLO arm64 Image (Multi-Version)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false # 即使某个版本失败，其他版本也继续构建
      matrix:
        hailo_version: ["4.20.0", "4.21.0", "4.22.0", "4.23.0"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Image Name
        run: |
          # 确保仓库名转为小写，防止 GHCR 路径解析错误
          LOWER_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}-hailo" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=${LOWER_IMAGE_NAME}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (arm64 Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # 动态标签逻辑
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.hailo_version }}
            ${{ matrix.hailo_version == '4.23.0' && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          build-args: |
            TARGETPLATFORM=linux/arm64
            HAILO_VERSION=${{ matrix.hailo_version }}
          # --- 核心修复：禁用干扰层，提高树莓派兼容性 ---
          provenance: false
          sbom: false
          # ---------------------------------------
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Successfully built ${{ env.GHCR_IMAGE }}:${{ matrix.hailo_version }}"
